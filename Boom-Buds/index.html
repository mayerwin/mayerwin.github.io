<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Boom Buds has moved</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://boom-buds.github.io/">
  <script>
    // Boom Buds moved to https://boom-buds.github.io/ on 2026-11-23. Browsers keep saved data per site, so the
    // player's settings and edited levels (localStorage keys boombuds.settings.* and boombuds.schemes.*) go along
    // in the address fragment, which never reaches a server; the game imports them (src/app/originMove.ts).
    (function () {
      var target = 'https://boom-buds.github.io/' + location.search;
      var hash = location.hash || '';
      try {
        var data = {}, any = false;
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (/^boombuds\.(settings|schemes)\./.test(k)) { data[k] = localStorage.getItem(k); any = true; }
        }
        if (any) {
          var bytes = new TextEncoder().encode(JSON.stringify(data)), bin = '';
          for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
          hash = '#bb-move=' + btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
      } catch (e) { /* storage blocked: plain redirect */ }
      location.replace(target + hash);
    })();
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #2a1650; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    a { color: #ffb347; }
  </style>
</head>
<body>
  <p>💣 Boom Buds now lives at <a href="https://boom-buds.github.io/">boom-buds.github.io</a>.</p>
</body>
</html>
